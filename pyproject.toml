[project]
name = "pyHarmoniCA"
readme = "README.md"
requires-python = ">=3.13"
description = "Harmonize clinical assessments"
dependencies = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "huggingface_hub>=0.20.0"
]
dynamic = ["version"]

[project.optional-dependencies]
ui = ["gradio>=4.0"]

[project.scripts]
harmonica = "harmonica.harmonize:main"
harmonica-ui = "harmonica.app:main"

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmonica"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
test = [
    "pytest>=8.4.2"
]
dev = ["pre-commit", {include-group = "test"}]