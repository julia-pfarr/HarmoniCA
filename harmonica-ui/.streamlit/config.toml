[theme]
# Colours from the HarmoniCA logo (petrol blue); the app's CSS variables in app.py use the same values
base = "light"
primaryColor = "#0F4C6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16303D"
linkColor = "#0F4C6B"
borderColor = "#DCE6EB"
# Semantic colours (info / success / warning / error banners) from the logo spectrum
blueColor = "#2A6DB5"
greenColor = "#4A8433"
yellowColor = "#D48C12"
orangeColor = "#E8834E"
redColor = "#C45A24"
showWidgetBorder = true
baseRadius = "8px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"

[theme.sidebar]
backgroundColor = "#FFFFFF"

[client]
# No Deploy button / developer toolbar for users
toolbarMode = "minimal"

[server]
maxUploadSize = 10
