# Reverse proxy: public port 80 -> Gradio app on localhost:7860.
# No domain yet, so this serves plain HTTP on the VM's IP. Once you have a
# domain pointed at this VM, run `sudo certbot --nginx` to add HTTPS on top
# of this config with no other changes needed.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
